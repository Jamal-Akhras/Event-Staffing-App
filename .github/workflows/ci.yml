name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + alembic, ${{ matrix.data_path }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - data_path: in-memory
            use_in_memory: "true"
          - data_path: postgres
            use_in_memory: "false"

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: event_staffing
          POSTGRES_USER: event_staffing
          POSTGRES_PASSWORD: event_staffing_local_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U event_staffing -d event_staffing"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://event_staffing:event_staffing_local_password@localhost:5432/event_staffing
      ENVIRONMENT: development
      DEV_MODE: "true"
      USE_IN_MEMORY: ${{ matrix.use_in_memory }}
      JWT_SECRET_KEY: ci-only-not-a-real-secret-just-for-tests-padding-32

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python -m alembic -c apps/api/alembic.ini upgrade head

      - name: Run tests
        run: python -m pytest -q

  web:
    name: Web (tsc + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  mobile:
    name: Mobile (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit
