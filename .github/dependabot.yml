version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # bcrypt 5 removes the API passlib 1.7.4 relies on; stays at 4.0.1 until passlib is replaced.
      - dependency-name: bcrypt
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Expo SDK pins native module versions; anything beyond a patch goes through `npx expo install` during an SDK migration.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # These are pinned to exact versions by the Expo SDK, so patch bumps are excluded too.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-native
      - dependency-name: react-native-worklets
      - dependency-name: "@types/react"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # Interpreter version is changed together with the CI matrix, not by Dependabot.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
